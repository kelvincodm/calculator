<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
        
      
    <title>Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="style.css" rel="stylesheet">
    </head>
   <body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;"><button onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">X</button>
        <button onclick="appendValue('/')">/</button>
        <button onclick="appendValue('*')">*</button></div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('-')">-</button></div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('+')">+</button></div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculateResult()">=</button></div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
    </div>
</div>

    <script src="javascript.js"></script>
   </body>
</html>
